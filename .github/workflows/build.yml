name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The project targets JVM 25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Chaquopy (yt-dlp) needs a matching Python on the build machine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # The bundled gradle-wrapper.jar is not a working wrapper, so use a real Gradle install
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vitune-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # The Mac version (desktop/ folder). Separate from the Android build above.
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      # yt-dlp finds the audio, quickjs helps it with YouTube's player code, ffmpeg decodes the sound.
      - name: Download yt-dlp, ffmpeg and quickjs
        run: |
          dir=desktop/resources/macos-arm64
          mkdir -p "$dir"
          # The folder version of yt-dlp starts much faster than the single-file one, which unpacks itself every time.
          curl -fsSL -o ytdlp.zip https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos.zip
          mkdir ytdlp && unzip -q ytdlp.zip -d ytdlp && rm ytdlp.zip
          exe=$(find ytdlp -name yt-dlp_macos -type f | head -1)
          mv "$(dirname "$exe")" "$dir/yt-dlp_macos"
          chmod +x "$dir/yt-dlp_macos/yt-dlp_macos"
          curl -fsSL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz | gunzip > "$dir/ffmpeg"
          curl -fsSL -o "$dir/qjs" https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-darwin-arm64
          chmod +x "$dir/ffmpeg" "$dir/qjs"
          codesign --force --sign - "$dir/ffmpeg"
          codesign --force --sign - "$dir/qjs"
          ls -la "$dir" "$dir/yt-dlp_macos" | head -20
          "$dir/yt-dlp_macos/yt-dlp_macos" --version
          "$dir/ffmpeg" -version | head -1

      # Only the desktop project and what it uses get configured, so the Android setup isn't needed here.
      - name: Build Mac app
        run: gradle :desktop:packageDmg --configure-on-demand --no-daemon --stacktrace

      # Opens the built app for 25 seconds to make sure it starts and stays open.
      - name: Launch the app
        run: |
          app=desktop/build/compose/binaries/main/app/Vertune.app/Contents/MacOS/Vertune
          "$app" > launch.log 2>&1 &
          pid=$!
          sleep 25
          log="$HOME/Library/Application Support/Vertune/vertune.log"
          cat launch.log; echo "---- vertune.log"; cat "$log" || true
          if kill -0 $pid 2>/dev/null; then echo "App is still running"; kill $pid; else echo "App quit on its own"; exit 1; fi

      - name: Check search, yt-dlp, ffmpeg and the library
        continue-on-error: true
        run: gradle :desktop:smokeTest --configure-on-demand --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vertune-mac-dmg
          path: desktop/build/compose/binaries/main/dmg/*.dmg

  # The Windows version (same desktop/ folder as the Mac one). Builds an .msi installer.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      # The same three helpers as the Mac app, in their Windows versions.
      - name: Download yt-dlp, ffmpeg and quickjs
        run: |
          dir=desktop/resources/windows-x64
          mkdir -p "$dir"
          # The folder version of yt-dlp starts much faster than the single .exe, which unpacks itself every time.
          curl -fsSL -o ytdlp.zip https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_win.zip
          mkdir ytdlp && unzip -q ytdlp.zip -d ytdlp && rm ytdlp.zip
          exe=$(find ytdlp -name yt-dlp.exe -type f | head -1)
          mv "$(dirname "$exe")" "$dir/yt-dlp"
          curl -fsSL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz | gunzip > "$dir/ffmpeg.exe"
          curl -fsSL -o "$dir/qjs.exe" https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-windows-x86_64.exe
          ls -la "$dir" | head -20
          "$dir/yt-dlp/yt-dlp.exe" --version
          "$dir/ffmpeg.exe" -version | head -1
          echo 'console.log("qjs ok")' > t.js && "$dir/qjs.exe" t.js

      - name: Build Windows installer
        run: gradle :desktop:createDistributable :desktop:packageMsi --configure-on-demand --no-daemon --stacktrace

      # Opens the built app for 25 seconds to make sure it starts and stays open.
      - name: Launch the app
        run: |
          app=desktop/build/compose/binaries/main/app/Vertune/Vertune.exe
          "$app" > launch.log 2>&1 &
          pid=$!
          sleep 25
          cat launch.log; echo "---- vertune.log"; cat "$APPDATA/Vertune/vertune.log" || true
          if tasklist //FI "IMAGENAME eq Vertune.exe" | grep -qi vertune.exe; then
            echo "App is still running"; taskkill //F //IM Vertune.exe
          else
            echo "App quit on its own"; exit 1
          fi

      - name: Check search, yt-dlp, ffmpeg and the library
        continue-on-error: true
        run: gradle :desktop:smokeTest --configure-on-demand --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vertune-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
